# Apache Virtual Host Configuration for rise.altzor.com
# -------------------------------------------------------

<VirtualHost *:80>
    ServerName rise.altzor.com

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName rise.altzor.com

    # SSL Configuration (Santosh to confirm actual certificate paths)
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/altzor.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/altzor.com/privkey.pem

    # 1. Frontend Static Files
    Alias /static /var/www/rise/public_html/HRMS/RISE-Frontend/static
    <Directory /var/www/rise/public_html/HRMS/RISE-Frontend/static>
        Require all granted
    </Directory>

    # 2. Backend Uploads
    Alias /api/uploads /var/www/rise/public_html/HRMS/HRSystem/uploads
    <Directory /var/www/rise/public_html/HRMS/HRSystem/uploads>
        Require all granted
    </Directory>

    # 3. Route API traffic to Backend (Port 8000)
    # The trailing slash on both sides ensures /api/employees becomes /employees to Flask
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/
    ProxyPassReverse /api/ http://127.0.0.1:8000/

    # 4. Route all other traffic to Frontend (Port 8001)
    ProxyPass /static !
    ProxyPass /api/uploads !
    ProxyPass / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/rise.altzor.com-error.log
    CustomLog ${APACHE_LOG_DIR}/rise.altzor.com-access.log combined

</VirtualHost>
